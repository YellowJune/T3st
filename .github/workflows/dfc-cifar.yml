name: DFC CIFAR-100 stability final

on:
  push:
    paths:
      - "remote/RUN_PROTOCOL.md"
  pull_request:
    paths:
      - "remote/RUN_PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exactness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Exact optimizer and checkpoint tests
        working-directory: remote
        run: python -m unittest -v test_torch_fiber.py
      - name: Record runner sensors and versions
        run: |
          mkdir -p results
          python - <<'PY' > results/environment.txt
          import glob, os, platform, torch
          print("platform", platform.platform())
          print("torch", torch.__version__)
          print("cuda", torch.cuda.is_available())
          print("rapl", glob.glob('/sys/class/powercap/**/energy_uj', recursive=True))
          print("cpu_count", os.cpu_count())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-environment-and-exactness
          path: results/environment.txt
          if-no-files-found: error
      - name: Persist exactness evidence on an isolated result branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "result-${GITHUB_RUN_ID}-exactness"
          git add -f results/environment.txt
          git commit -m "DFC exactness environment ${GITHUB_RUN_ID}"
          git push origin HEAD

  dataset:
    needs: exactness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download immutable CIFAR-100 mirror
        run: |
          mkdir -p data
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
            -o data/cifar-100-python.tar.gz \
            "https://huggingface.co/datasets/nakroy/cifar100-python/resolve/main/cifar-100-python.tar.gz?download=true"
          echo "85cd44d02ba6437773c5bbd22e183051d648de2e7d6b014e1ef29b855ba677a7  data/cifar-100-python.tar.gz" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cifar100-source-85cd44d0
          path: data/cifar-100-python.tar.gz
          if-no-files-found: error

  cifar100:
    needs: [exactness, dataset]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        method: [naive, derpp, dfc_low16_derpp]
        seed: [431, 433, 439]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: cifar100-source-85cd44d0
          path: remote/data
      - name: Run fixed-update CIFAR-100 stream
        working-directory: remote
        run: >-
          python vision_benchmark.py
          --method ${{ matrix.method }}
          --seed ${{ matrix.seed }}
          --updates-per-task 300
          --batch-size 64
          --replay-count 48
          --width 48
          --memory-bytes 32768
          --insert-count 4
          --distill-weight 1.0
          --threads 4
          --output results/cifar100_${{ matrix.method }}_seed${{ matrix.seed }}.json
      - name: Hash result
        working-directory: remote
        run: sha256sum results/*.json > results/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cifar100-${{ matrix.method }}-seed${{ matrix.seed }}
          path: remote/results/
          if-no-files-found: error
      - name: Persist result on an isolated branch
        working-directory: remote
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "result-${GITHUB_RUN_ID}-${{ matrix.method }}-${{ matrix.seed }}"
          git add -f results/
          git commit -m "CIFAR-100 ${{ matrix.method }} seed ${{ matrix.seed }}"
          git push origin HEAD
