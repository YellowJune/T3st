name: DFC-EF CPU exactness gate

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'remote/dfc_ef.py'
      - 'remote/test_dfc_ef.py'
      - 'remote/chunked_low16_adamw.py'
      - 'remote/test_chunked_low16_adamw.py'
      - 'remote/kaggle_checkpoint.py'
      - 'remote/test_kaggle_checkpoint.py'
      - 'remote/torch_fiber.py'
      - '.github/workflows/dfc-ef-cpu-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exactness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run DFC-EF exactness and checkpoint gates
        working-directory: remote
        run: python -m pytest -q test_dfc_ef.py test_chunked_low16_adamw.py test_kaggle_checkpoint.py
