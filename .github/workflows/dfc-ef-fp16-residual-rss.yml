name: DFC-EF physical RSS vs external FP16 residual

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - '.github/workflows/dfc-ef-fp16-residual-rss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.30,<1' sentencepiece accelerate numpy
      - name: Measure all-24-block RSS for DFC and external FP16 EF
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        working-directory: remote
        run: |
          ROOT='../results/fp16_rss'; mkdir -p "$ROOT"
          /usr/bin/time -v -o "$ROOT/time_dfc.txt" python llm_dfc_ef_qwen_safe.py \
            --method dfc_ef --seed 1901 --device cpu --train-last-layers 24 --updates 2 --batch-size 1 \
            --eval-batch-size 4 --eval-every 2 --keep-ratio 0.125 --deterministic --output "$ROOT/dfc.json"
          /usr/bin/time -v -o "$ROOT/time_fp16.txt" python llm_external_fp16_ef.py \
            --method external_ef --seed 1901 --device cpu --train-last-layers 24 --updates 2 --batch-size 1 \
            --eval-batch-size 4 --eval-every 2 --keep-ratio 0.125 --deterministic --output "$ROOT/fp16.json"
          python - <<'PY'
          import hashlib,json,re
          root='../results/fp16_rss'
          def rss(p):
              t=open(p).read(); m=re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)',t); assert m; return int(m.group(1))*1024
          d=json.load(open(root+'/dfc.json')); q=json.load(open(root+'/fp16.json')); P=d['trainable_parameters']; dr=rss(root+'/time_dfc.txt'); qr=rss(root+'/time_fp16.txt'); theory=2*P; delta=qr-dr
          out={'schema_version':1,'protocol':'dfc-ef-vs-external-fp16-rss-v1','status':'COMPLETE','trainable_parameters':P,'dfc_peak_rss_bytes':dr,'external_fp16_peak_rss_bytes':qr,'measured_rss_delta_bytes':delta,'theoretical_external_fp16_residual_bytes':theory,'rss_delta_fraction_of_2P':delta/theory,'external_fp16_logical_residual_bytes':2*P,'dfc_external_residual_bytes':0,'dfc_fiber_capacity_bytes':4*P,'dfc_final_eval_loss':d['final_eval_loss'],'fp16_final_eval_loss':q['final_eval_loss'],'claim_boundary':'Physical CPU RSS comparison against a realistic external FP16 EF state. Residual numerical semantics differ (FP16 external vs logical FP32 in DFC), so this is not a placement-equivalence trajectory gate.'}
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode(); out['result_sha256']=hashlib.sha256(raw).hexdigest(); open(root+'/summary.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfc-vs-external-fp16-rss
          path: results/fp16_rss/*
          if-no-files-found: warn
          retention-days: 30
