name: DFC-EF JAX cross-substrate preflight

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'remote/tpu_dfc_ef_jax.py'
      - '.github/workflows/dfc-ef-jax-cpu-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jax-cpu-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JAX CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jax[cpu]>=0.6,<1' numpy
      - name: Execute cross-substrate logic before TPU allocation
        working-directory: remote
        run: |
          python tpu_dfc_ef_jax.py \
            --exact-coordinates 10007 \
            --exact-steps 12 \
            --timing-sizes '1024,16384,131072' \
            --timing-steps 3 \
            --stride 8 \
            --output ../results/free_preflight/jax_cpu_dfc_ef.json
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-ef-jax-cpu-preflight-${{ github.sha }}
          path: results/free_preflight/jax_cpu_dfc_ef.json
          if-no-files-found: error
          retention-days: 30
