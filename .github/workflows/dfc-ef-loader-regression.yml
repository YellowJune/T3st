name: DFC-EF loader regression

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - '.github/workflows/dfc-ef-loader-regression.yml'
      - 'remote/chunked_low16_adamw.py'
      - 'remote/test_chunked_low16_adamw.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch 2.7.1 CPU stack
        run: |
          python -m pip install --quiet 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet pytest numpy
      - name: Run complete DFC-EF CPU gate
        working-directory: remote
        run: |
          python -m pytest -q test_dfc_ef.py test_block_topk_ef.py test_chunked_low16_adamw.py test_kaggle_checkpoint.py
