name: DFC-EF Qwen full-transformer checkpoint substitution

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - '.github/workflows/dfc-ef-qwen-full-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.30,<1' sentencepiece accelerate numpy
      - name: Materialize and measure each large checkpoint sequentially
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        working-directory: remote
        run: |
          ROOT='../results/full_checkpoint'; CK='../checkpoints/full_checkpoint'; mkdir -p "$ROOT" "$CK"
          for METHOD in external_ef dfc_ef; do
            python llm_dfc_ef_qwen_safe.py --method "$METHOD" --seed 1901 --device cpu --train-last-layers 24 \
              --updates 1 --batch-size 1 --eval-batch-size 4 --eval-every 1 --keep-ratio 0.125 --deterministic \
              --checkpoint "$CK/${METHOD}.pt" --checkpoint-every 1 --output "$ROOT/${METHOD}.json"
            python - "$ROOT/${METHOD}.json" "$CK/${METHOD}.pt" <<'PY'
          import json,os,sys
          p=sys.argv[1]; ck=sys.argv[2]; r=json.load(open(p)); r['checkpoint_stat_bytes']=os.path.getsize(ck); open(p,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
            rm -f "$CK/${METHOD}.pt"
          done
          python - <<'PY'
          import hashlib,json
          root='../results/full_checkpoint'; e=json.load(open(root+'/external_ef.json')); d=json.load(open(root+'/dfc_ef.json'))
          exact={k:e[k]==d[k] for k in ['parameter_sha256','semantic_optimizer_sha256','logical_residual_sha256','final_accuracy','final_eval_loss','transmitted_values']}
          P=e['trainable_parameters']; delta=e['checkpoint_stat_bytes']-d['checkpoint_stat_bytes']; theory=4*P
          out={'schema_version':1,'protocol':'qwen-dfc-ef-full-transformer-checkpoint-v1','status':'PASS' if all(exact.values()) and abs(delta-theory)<=8*1024*1024 else 'FAIL','exact':exact,'trainable_parameters':P,'theoretical_external_residual_bytes':theory,'external_checkpoint_bytes':e['checkpoint_stat_bytes'],'dfc_checkpoint_bytes':d['checkpoint_stat_bytes'],'measured_checkpoint_delta_bytes':delta,'delta_error_bytes':delta-theory,'delta_fraction_of_4P':delta/theory,'claim_boundary':'Actual Qwen2.5-0.5B all-24-transformer-block persistent checkpoint substitution; embeddings/final norm/lm_head remain frozen/common.'}
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode(); out['result_sha256']=hashlib.sha256(raw).hexdigest(); open(root+'/summary.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          if out['status']!='PASS': raise SystemExit('full checkpoint gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-full-transformer-checkpoint-summary
          path: results/full_checkpoint/*.json
          if-no-files-found: warn
          retention-days: 30
