name: DFC-EF Qwen2.5-1.5B pinned 3-seed replication

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - '.github/workflows/dfc-ef-qwen1p5b-3seed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    name: qwen1p5b-seed${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix: {seed: [1901, 1931, 1951]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.30,<1' sentencepiece accelerate numpy
      - name: Run pinned same-host placement pair
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        working-directory: remote
        run: |
          ROOT='../results/qwen1p5b_3seed/seed${{ matrix.seed }}'; mkdir -p "$ROOT"
          for METHOD in external_ef dfc_ef; do
            python llm_dfc_ef_qwen_safe.py --method "$METHOD" --seed '${{ matrix.seed }}' \
              --model 'Qwen/Qwen2.5-1.5B' --revision '8faed761d45a263340a0528343f099c05c9a4323' --device cpu --train-last-layers 1 \
              --updates 8 --batch-size 1 --eval-batch-size 2 --eval-every 8 --keep-ratio 0.125 --deterministic --output "$ROOT/${METHOD}.json"
          done
          S='${{ matrix.seed }}' python - <<'PY'
          import hashlib,json,os
          s=int(os.environ['S']); root=f'../results/qwen1p5b_3seed/seed{s}'; e=json.load(open(root+'/external_ef.json')); d=json.load(open(root+'/dfc_ef.json')); exact={k:e[k]==d[k] for k in ['parameter_sha256','semantic_optimizer_sha256','logical_residual_sha256','final_accuracy','final_eval_loss','history','transmitted_values']}; P=e['trainable_parameters']; storage=e['actual_external_residual_bytes']==4*P and d['actual_external_residual_bytes']==0 and d['dfc_fiber_capacity_bytes']==4*P; out={'schema_version':1,'protocol':'qwen2p5-1p5b-dfc-ef-pinned-pair-v1','seed':s,'status':'PASS' if all(exact.values()) and storage else 'FAIL','exact':exact,'storage_ok':storage,'resolved_revision':e['resolved_hub_revision'],'total_model_parameters':e['total_model_parameters'],'trainable_parameters':P,'external_residual_bytes':4*P,'external_wall_seconds':e['wall_seconds'],'dfc_wall_seconds':d['wall_seconds']}; raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode(); out['result_sha256']=hashlib.sha256(raw).hexdigest(); open(root+'/summary.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True));
          if out['status']!='PASS': raise SystemExit('1.5B pair failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen1p5b-pair-seed${{ matrix.seed }}
          path: results/qwen1p5b_3seed/seed${{ matrix.seed }}/*.json
          if-no-files-found: warn
          retention-days: 30
