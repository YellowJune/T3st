name: DFC-EF Qwen2.5-7B free GitHub ceiling attempt

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - '.github/workflows/dfc-ef-qwen7b-ceiling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.30,<1' sentencepiece accelerate numpy
      - name: Attempt DFC first, then matched external only if feasible
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        working-directory: remote
        run: |
          ROOT='../results/qwen7b_ceiling'; mkdir -p "$ROOT"
          df -h . > "$ROOT/disk_before.txt" || true
          free -b > "$ROOT/memory_before.txt" || true
          set +e
          timeout 2400 python llm_dfc_ef_cpu_bf16_safe.py --method dfc_ef --seed 1901 \
            --model 'Qwen/Qwen2.5-7B' --revision main --device cpu --train-last-layers 1 \
            --updates 1 --batch-size 1 --eval-batch-size 1 --eval-every 1 --keep-ratio 0.125 --deterministic \
            --output "$ROOT/dfc_ef.json" > "$ROOT/dfc_stdout.txt" 2> "$ROOT/dfc_stderr.txt"
          DRC=$?; echo "$DRC" > "$ROOT/dfc.rc"
          ERC=999
          if [ "$DRC" -eq 0 ]; then
            timeout 2400 python llm_dfc_ef_cpu_bf16_safe.py --method external_ef --seed 1901 \
              --model 'Qwen/Qwen2.5-7B' --revision main --device cpu --train-last-layers 1 \
              --updates 1 --batch-size 1 --eval-batch-size 1 --eval-every 1 --keep-ratio 0.125 --deterministic \
              --output "$ROOT/external_ef.json" > "$ROOT/external_stdout.txt" 2> "$ROOT/external_stderr.txt"
            ERC=$?
          fi
          echo "$ERC" > "$ROOT/external.rc"
          set -e
          df -h . > "$ROOT/disk_after.txt" || true
          free -b > "$ROOT/memory_after.txt" || true
          python - <<'PY'
          import hashlib,json,os
          root='../results/qwen7b_ceiling'; drc=int(open(root+'/dfc.rc').read()); erc=int(open(root+'/external.rc').read()); out={'schema_version':1,'protocol':'qwen2p5-7b-free-github-ceiling-v1','dfc_return_code':drc,'external_return_code':erc}
          if drc==0 and erc==0:
              d=json.load(open(root+'/dfc_ef.json')); e=json.load(open(root+'/external_ef.json')); exact={k:d[k]==e[k] for k in ['parameter_sha256','semantic_optimizer_sha256','logical_residual_sha256','final_accuracy','final_eval_loss','transmitted_values']}; P=d['trainable_parameters']; out.update({'status':'PASS' if all(exact.values()) else 'FAIL','exact':exact,'resolved_revision':d['resolved_hub_revision'],'total_model_parameters':d['total_model_parameters'],'trainable_parameters':P,'theoretical_external_residual_bytes':4*P,'claim_boundary':'Actual Qwen2.5-7B CPU BF16 one-update placement pair on a free hosted runner; not GPU/HBM evidence.'})
          elif drc==0:
              d=json.load(open(root+'/dfc_ef.json')); out.update({'status':'DFC_COMPLETED_EXTERNAL_RESOURCE_LIMIT','resolved_revision':d['resolved_hub_revision'],'total_model_parameters':d['total_model_parameters'],'trainable_parameters':d['trainable_parameters'],'theoretical_external_residual_bytes':4*d['trainable_parameters'],'claim_boundary':'DFC path completed but matched external path did not; inspect retained stderr/resources before attributing the failure to memory.'})
          else:
              err=open(root+'/dfc_stderr.txt',errors='replace').read()[-4000:] if os.path.exists(root+'/dfc_stderr.txt') else ''
              out.update({'status':'FREE_RUNNER_RESOURCE_OR_DOWNLOAD_LIMIT','dfc_stderr_tail':err,'claim_boundary':'The 7B ceiling attempt could not complete even the DFC path; no 7B positive empirical claim is made.'})
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode(); out['result_sha256']=hashlib.sha256(raw).hexdigest(); open(root+'/summary.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          if out['status']=='FAIL': raise SystemExit('scientific mismatch')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen7b-free-github-ceiling
          path: results/qwen7b_ceiling/*
          if-no-files-found: warn
          retention-days: 30
