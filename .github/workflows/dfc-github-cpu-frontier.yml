name: DFC GitHub CPU frontier validation

on:
  push:
    branches:
      - dfc-v3.2-github-cpu-frontier
    paths:
      - "cpu_frontier/**"
      - "remote/torch_fiber.py"
      - ".github/workflows/dfc-github-cpu-frontier.yml"
  pull_request:
    branches:
      - dfc-v2.1-validation
    paths:
      - "cpu_frontier/**"
      - "remote/torch_fiber.py"
      - ".github/workflows/dfc-github-cpu-frontier.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dfc-github-cpu-frontier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontier:
    name: frontier-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm CPU-only execution boundary
        run: |
          python - <<'PY'
          import numpy as np, torch
          print("torch", torch.__version__)
          print("numpy", np.__version__)
          print("cuda_available", torch.cuda.is_available())
          if torch.cuda.is_available():
              raise SystemExit("This workflow is intentionally CPU-only")
          PY
      - name: Run DFC CPU frontier suite
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: >-
          python cpu_frontier/frontier_suite.py
          --output results/cpu_frontier/frontier_py${{ matrix.python }}.json
          --sign-coordinates 262144
          --sign-steps 64
          --low-coordinates 131072
          --low-steps 32
      - name: Hash raw evidence
        run: sha256sum results/cpu_frontier/*.json > results/cpu_frontier/SHA256SUMS_py${{ matrix.python }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-cpu-frontier-py${{ matrix.python }}
          path: results/cpu_frontier/
          if-no-files-found: error
          retention-days: 90

  fuzz:
    name: randomized-adversarial-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run 128 randomized falsification cases
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          mkdir -p results/cpu_frontier
          python cpu_frontier/randomized_fuzz.py \
            --output results/cpu_frontier/randomized_fuzz_128.json \
            --cases 128 \
            --seed 910241
      - name: Hash fuzz evidence
        run: sha256sum results/cpu_frontier/*.json > results/cpu_frontier/SHA256SUMS_fuzz.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-cpu-frontier-fuzz
          path: results/cpu_frontier/
          if-no-files-found: error
          retention-days: 90

  ddp:
    name: gloo-ddp-${{ matrix.world }}rank
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        world: [2, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm CPU-only execution boundary
        run: |
          python - <<'PY'
          import torch
          if torch.cuda.is_available():
              raise SystemExit("This workflow is intentionally CPU-only")
          PY
      - name: Run multi-rank CPU DDP exactness gate
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: >-
          python -m torch.distributed.run --standalone --nproc_per_node=${{ matrix.world }}
          cpu_frontier/ddp_cpu_exactness.py
          --output results/cpu_frontier/ddp_gloo_${{ matrix.world }}rank.json
          --steps 16
          --min-world-size ${{ matrix.world }}
      - name: Hash DDP evidence
        run: sha256sum results/cpu_frontier/*.json > results/cpu_frontier/SHA256SUMS_ddp${{ matrix.world }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-cpu-frontier-ddp${{ matrix.world }}
          path: results/cpu_frontier/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-and-freeze
    needs: [frontier, fuzz, ddp]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dfc-cpu-frontier-*
          path: results/cpu_frontier
          merge-multiple: true
      - name: Verify and aggregate all publication gates
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("results/cpu_frontier")
          files = sorted(root.glob("*.json"))
          expected = {
              "frontier_py3.11.json",
              "frontier_py3.12.json",
              "randomized_fuzz_128.json",
              "ddp_gloo_2rank.json",
              "ddp_gloo_4rank.json",
          }
          observed = {p.name for p in files}
          if observed != expected:
              raise SystemExit(f"unexpected raw JSON set: expected={sorted(expected)} observed={sorted(observed)}")
          rows = []
          for path in files:
              obj = json.loads(path.read_text())
              if obj.get("status") != "PASS":
                  raise SystemExit(f"publication gate failed: {path}: {obj.get('status')}")
              cuda = bool(obj.get("environment", {}).get("cuda_available", obj.get("cuda_available", False)))
              if cuda:
                  raise SystemExit(f"CPU-only contract violated by {path}")
              updates = obj.get(
                  "coordinate_updates",
                  obj.get("total_stress_coordinate_updates", obj.get("total_coordinate_updates", 0)),
              )
              rows.append({
                  "file": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "schema": obj.get("schema"),
                  "status": obj.get("status"),
                  "coordinate_updates": int(updates),
              })

          sources = [
              pathlib.Path("cpu_frontier/frontier_suite.py"),
              pathlib.Path("cpu_frontier/randomized_fuzz.py"),
              pathlib.Path("cpu_frontier/ddp_cpu_exactness.py"),
              pathlib.Path("remote/torch_fiber.py"),
              pathlib.Path(".github/workflows/dfc-github-cpu-frontier.yml"),
          ]
          source_hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sources}

          report = {
              "schema": "dfc-github-cpu-frontier-aggregate-v3",
              "status": "PASS",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["GITHUB_SHA"],
              "hardware_scope": "GitHub-hosted CPU only; no CUDA/H100/H200/B200/B300 claims",
              "raw_evidence": rows,
              "source_sha256": source_hashes,
              "total_reported_coordinate_updates": sum(int(r["coordinate_updates"]) for r in rows),
              "publication_claims_supported": [
                  "adversarial DFC-SIGN payload noninterference",
                  "FP32/BF16/FP16 parameter-dtype coverage with FP32 optimizer state",
                  "cross-optimizer-tensor payload addressing",
                  "DFC-SIGN and DFC-LOW16 checkpoint/restore/continued-training preservation",
                  "multi-parameter-group, weight-decay, accumulated-gradient, and missing-gradient coverage",
                  "closed-form DFC-SIGN and DFC-LOW16 capacity identities",
                  "finite IEEE-754 subnormal/sign-payload boundary exactness",
                  "multi-million-coordinate CPU stress exactness",
                  "128 randomized adversarial SIGN/LOW16 cases with randomized tensor partitions, hyperparameters, missing gradients, payload rewrites, and checkpoint positions",
                  "2-rank and 4-rank CPU/Gloo DDP with rank-distinct hidden payloads and identical semantic parameters",
              ],
              "explicitly_excluded_claims": [
                  "GPU latency or throughput",
                  "Nsight DRAM/L2 hardware counters",
                  "H100/H200/B200/B300 architecture generalization",
                  "CUDA/Triton performance overhead",
              ],
          }
          out = root / "aggregate.json"
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(out.read_text())
          PY
      - name: Freeze SHA-256 manifest
        run: |
          cd results/cpu_frontier
          sha256sum *.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-cpu-frontier-complete-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: results/cpu_frontier/
          if-no-files-found: error
          retention-days: 90
      - name: Persist immutable evidence on isolated result branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="result-${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}-cpu-frontier"
          git checkout -b "$branch"
          git add -f results/cpu_frontier/
          git commit -m "DFC CPU frontier evidence ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD
