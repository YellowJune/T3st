name: DFC Triton actual-GPU gate

on:
  push:
    paths:
      - "remote/RUN_GPU.md"
  workflow_dispatch:
    inputs:
      runner_label:
        description: Configured GitHub larger-runner or self-hosted GPU label
        required: true
        default: gpu-t4-4-core

permissions:
  contents: write

jobs:
  fused-gpu:
    runs-on: ${{ inputs.runner_label || 'gpu-t4-4-core' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove physical CUDA hardware
        run: |
          nvidia-smi
          test -e /dev/nvidia0
      - name: Install pinned CUDA PyTorch and Triton
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
          python - <<'PY'
          import torch, triton
          assert torch.cuda.is_available()
          print("torch", torch.__version__, "cuda", torch.version.cuda, "triton", triton.__version__)
          print(torch.cuda.get_device_properties(0))
          PY
      - name: Bitwise fused-kernel noninterference tests
        working-directory: remote
        run: python -m unittest -v test_triton_dfc.py
      - name: Interleaved fused benchmark
        working-directory: remote
        shell: bash
        run: |
          mkdir -p gpu_results
          set +e
          python benchmark_triton_dfc.py \
            --sizes 1048576,8388608,33554432 \
            --primary-size 8388608 \
            --warmup 40 \
            --repetitions 200 \
            --rounds 9 \
            --maximum-primary-overhead-percent 5.0 \
            --output gpu_results/triton_dfc_gpu.json
          status=$?
          set -e
          printf '%s\n' "$status" > gpu_results/benchmark_exit_code.txt
          test -s gpu_results/triton_dfc_gpu.json
      - name: Bind environment and hashes
        working-directory: remote
        run: |
          nvidia-smi -q > gpu_results/nvidia_smi_q.txt
          python -m pip freeze > gpu_results/environment.txt
          sha256sum gpu_results/* > gpu_results/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: triton-dfc-actual-gpu-${{ github.run_id }}
          path: remote/gpu_results/
          if-no-files-found: error
      - name: Persist immutable GPU evidence before acceptance
        working-directory: remote
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "result-${GITHUB_RUN_ID}-triton-gpu"
          git add -f gpu_results/
          git commit -m "Triton DFC-Sign actual GPU benchmark ${GITHUB_RUN_ID}"
          git push origin HEAD
      - name: Enforce exactness and predeclared 5 percent gate
        working-directory: remote
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row = json.loads(Path("gpu_results/triton_dfc_gpu.json").read_text())
          assert row["schema"] == "dfc-triton-gpu-v1"
          assert row["device"]["gpu_name"]
          assert row["device"]["cuda_runtime"]
          assert row["device"]["github_run_id"] == "${GITHUB_RUN_ID}"
          for result in row["results"]:
              exactness = result["exactness"]
              assert exactness["updates"] == 8
              assert exactness["parameter_bitwise_equal"]
              assert exactness["first_moment_bitwise_equal"]
              assert exactness["second_magnitude_bitwise_equal"]
              assert exactness["payload_bitwise_preserved"]
          gate = row["acceptance_gate"]
          assert gate["maximum_overhead_percent"] == 5.0
          assert gate["passed"], gate
          print("actual-GPU acceptance gate passed", gate)
          PY
