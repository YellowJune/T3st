name: DFC Kaggle final preflight CI

on:
  push:
    branches: [dfc-kaggle-final]
  workflow_dispatch:

jobs:
  cpu-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile final validation scripts
        run: |
          python -m py_compile remote/dfc_ef_residual.py
          python -m py_compile remote/dfc_ef_memory_benchmark.py
          python -m py_compile remote/dfc_ef_gpu_preflight.py
          python -m py_compile remote/qwen05b_full_ef_kaggle.py
          python -m py_compile remote/llm_continual_qwen_partial_resume.py
          python -m py_compile remote/aggregate_kaggle_final.py
          python -m py_compile remote/universal_fibers_kaggle.py
          python -m py_compile remote/universal_fibers_cuda.py
          python -m py_compile kaggle/dfc_kaggle_final_gpu.py
          python -m py_compile kaggle_tpu/dfc_kaggle_tpu.py
      - name: DFC-EF paired exactness and checkpoint gate
        run: PYTHONPATH=remote python remote/test_dfc_ef_residual.py
      - name: Replay-store checkpoint restoration gate
        run: PYTHONPATH=remote python remote/test_llm_resume_store.py
      - name: Universal non-optimizer DFC rerun
        run: |
          mkdir -p results/kaggle_preflight
          PYTHONPATH=remote python remote/universal_fibers_kaggle.py --out results/kaggle_preflight/universal_cpu.json
          python - <<'PY'
          import json
          d=json.load(open('results/kaggle_preflight/universal_cpu.json'))
          assert d['total_failures']==0
          print('universal CPU rerun: PASS')
          PY
      - name: State-scale accounting smoke test
        run: |
          PYTHONPATH=remote python remote/dfc_ef_memory_benchmark.py \
            --device cpu --coordinates 100003 --timing-coordinates 4099 --repeats 3 \
            --output results/kaggle_preflight/memory_smoke.json
          python - <<'PY'
          import json
          d=json.load(open('results/kaggle_preflight/memory_smoke.json'))
          assert d['measured_eliminated_bytes_per_coordinate']==4.0
          assert d['exactness_timing']['payload_bit_failures']==0
          assert d['exactness_timing']['semantic_bit_failures']==0
          print('preflight JSON gate: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-kaggle-final-preflight
          path: results/kaggle_preflight/
