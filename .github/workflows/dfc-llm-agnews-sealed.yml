name: DFC Qwen AG News sealed matrix

on:
  workflow_dispatch:
  push:
    branches: [dfc-v2.1-validation]
    paths:
      - '.github/workflows/dfc-llm-agnews-sealed.yml'

permissions:
  contents: read

jobs:
  qwen-agnews-sealed:
    name: qwen-agnews-sealed-seed${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [811, 823, 839, 853, 877]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dfc-v2.1-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned execution stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.15,<1' 'accelerate>=1.4,<2' 'huggingface_hub>=0.30,<1' 'datasets>=3,<5' sentencepiece
      - name: Replay codec and optimizer persistence gates
        working-directory: remote
        run: python -m unittest -v test_llm_agnews_replay.py
      - name: Run all paired methods with fixed protocol
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        working-directory: remote
        run: |
          set -euo pipefail
          for method in naive derpp dfc_sign_derpp; do
            python llm_continual_qwen_agnews.py \
              --method "$method" \
              --seed '${{ matrix.seed }}' \
              --model 'Qwen/Qwen2.5-0.5B' \
              --revision '060db6499f32faf8b98477b0a26969ef7d8b9987' \
              --steps-per-task 64 \
              --external-bytes 512 \
              --train-per-class 32 \
              --eval-per-class 64 \
              --lora-rank 4 \
              --lora-last-layers 4 \
              --lr 0.01 \
              --output "../results/validation_v21/qwen_agnews_${method}_seed${{ matrix.seed }}.json"
          done
      - name: Show paired results
        run: cat results/validation_v21/qwen_agnews_*_seed${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-agnews-sealed-seed${{ matrix.seed }}
          path: results/validation_v21/qwen_agnews_*_seed${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 30
