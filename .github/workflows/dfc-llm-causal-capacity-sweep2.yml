name: DFC Qwen causal paired capacity sweep

on:
  push:
    branches: [dfc-v2.1-validation]
    paths: ['.github/workflows/dfc-llm-causal-capacity-sweep2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: qwen-${{ matrix.cfg }}-${{ matrix.method }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cfg: r16l8w025, method: derpp, rank: 16, layers: 8, steps: 96, lr: 0.005, replay_ce: 0.25, distill: 0.02}
          - {cfg: r16l8w025, method: dfc_sign_derpp, rank: 16, layers: 8, steps: 96, lr: 0.005, replay_ce: 0.25, distill: 0.02}
          - {cfg: r16l8w050, method: derpp, rank: 16, layers: 8, steps: 96, lr: 0.01, replay_ce: 0.50, distill: 0.02}
          - {cfg: r16l8w050, method: dfc_sign_derpp, rank: 16, layers: 8, steps: 96, lr: 0.01, replay_ce: 0.50, distill: 0.02}
          - {cfg: r32l8w050, method: derpp, rank: 32, layers: 8, steps: 96, lr: 0.005, replay_ce: 0.50, distill: 0.02}
          - {cfg: r32l8w050, method: dfc_sign_derpp, rank: 32, layers: 8, steps: 96, lr: 0.005, replay_ce: 0.50, distill: 0.02}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.15,<1' 'accelerate>=1.4,<2' 'huggingface_hub>=0.30,<1' sentencepiece
      - name: Run development cell
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        working-directory: remote
        run: |
          python llm_continual_qwen.py \
            --method '${{ matrix.method }}' \
            --seed 1853 \
            --model 'Qwen/Qwen2.5-0.5B' \
            --steps-per-task '${{ matrix.steps }}' \
            --external-bytes 512 \
            --lora-rank '${{ matrix.rank }}' \
            --lora-last-layers '${{ matrix.layers }}' \
            --lr '${{ matrix.lr }}' \
            --distill-weight '${{ matrix.distill }}' \
            --replay-ce-weight '${{ matrix.replay_ce }}' \
            --output '../results/validation_v21/qwen_sweep2_${{ matrix.cfg }}_${{ matrix.method }}_seed1853.json'
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-sweep2-${{ matrix.cfg }}-${{ matrix.method }}
          path: results/validation_v21/qwen_sweep2_${{ matrix.cfg }}_${{ matrix.method }}_seed1853.json
          if-no-files-found: error
