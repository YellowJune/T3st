name: DFC Qwen causal continual pilot

on:
  push:
    branches: [dfc-v2.1-validation]
    paths: ['.github/workflows/dfc-llm-causal-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: qwen-causal-${{ matrix.method }}-seed1801
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        method: [derpp, dfc_sign_derpp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.15,<1' 'accelerate>=1.4,<2' 'huggingface_hub>=0.30,<1' sentencepiece
      - name: Run causal continual adaptation
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        working-directory: remote
        run: |
          python llm_continual_qwen_causal_v2.py \
            --method '${{ matrix.method }}' \
            --seed 1801 \
            --steps-per-task 64 \
            --external-bytes 512 \
            --lora-rank 4 \
            --lora-last-layers 4 \
            --lr 0.01 \
            --distill-weight 0.02 \
            --output '../results/validation_v21/qwen_causal_${{ matrix.method }}_seed1801.json'
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-causal-${{ matrix.method }}-seed1801
          path: results/validation_v21/qwen_causal_${{ matrix.method }}_seed1801.json
          if-no-files-found: error
