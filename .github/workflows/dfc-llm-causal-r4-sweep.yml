name: DFC Qwen causal rank4 replay sweep

on:
  push:
    branches: [dfc-v2.1-validation]
    paths: ['.github/workflows/dfc-llm-causal-r4-sweep.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: qwen-${{ matrix.cfg }}-${{ matrix.method }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cfg: r4w025, method: derpp, replay_ce: 0.25, distill: 0.01}
          - {cfg: r4w025, method: dfc_sign_derpp, replay_ce: 0.25, distill: 0.01}
          - {cfg: r4w010, method: derpp, replay_ce: 0.10, distill: 0.005}
          - {cfg: r4w010, method: dfc_sign_derpp, replay_ce: 0.10, distill: 0.005}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.15,<1' 'accelerate>=1.4,<2' 'huggingface_hub>=0.30,<1' sentencepiece
      - name: Run longer small-LoRA development cell
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        working-directory: remote
        run: |
          python llm_continual_qwen.py \
            --method '${{ matrix.method }}' \
            --seed 1867 \
            --model 'Qwen/Qwen2.5-0.5B' \
            --steps-per-task 128 \
            --external-bytes 512 \
            --lora-rank 4 \
            --lora-last-layers 4 \
            --lr 0.01 \
            --distill-weight '${{ matrix.distill }}' \
            --replay-ce-weight '${{ matrix.replay_ce }}' \
            --output '../results/validation_v21/qwen_r4_${{ matrix.cfg }}_${{ matrix.method }}_seed1867.json'
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-r4-${{ matrix.cfg }}-${{ matrix.method }}
          path: results/validation_v21/qwen_r4_${{ matrix.cfg }}_${{ matrix.method }}_seed1867.json
          if-no-files-found: error
