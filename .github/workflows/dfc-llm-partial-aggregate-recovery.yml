name: DFC Qwen partial aggregate recovery

on:
  push:
    branches: [dfc-v2.1-validation]
    paths: ['.github/workflows/dfc-llm-partial-aggregate-recovery.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aggregate-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aggregation dependency
        run: python -m pip install 'numpy==2.3.2'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: YellowJune/T3st
          run-id: 31315481945
          pattern: qwen-partial-final-*
          path: rows
          merge-multiple: true
      - name: Recompute matrices, audit resources, and apply predeclared gate
        run: |
          python - <<'PY'
          import glob, hashlib, json, statistics
          import numpy as np
          paths=sorted(glob.glob('rows/*.json'))
          rows=[json.load(open(p)) for p in paths]
          methods=('derpp','dfc_sign_derpp')
          seeds=[1901,1931,1951,1987,2017]
          assert len(rows)==10, len(rows)
          by={s:{} for s in seeds}
          for r in rows:
              assert r['protocol']=='qwen-causal-partial-v1'
              s=int(r['seed']); m=r['method']
              assert s in by and m in methods and m not in by[s]
              mat=np.asarray(r['accuracy_matrix'],dtype=float)
              final=float(np.nanmean(mat[-1]))
              current=float(np.nanmean(np.diag(mat)))
              forgetting=[]
              for t in range(mat.shape[0]-1):
                  hist=mat[t:,t]
                  forgetting.append(float(np.nanmax(hist[:-1])-hist[-1]))
              forgetting=float(np.mean(forgetting))
              assert abs(final-r['final_average_accuracy'])<1e-12
              assert abs(current-r['current_task_accuracy'])<1e-12
              assert abs(forgetting-r['average_forgetting'])<1e-12
              by[s][m]=r
          for s in seeds:
              assert set(by[s])==set(methods)
              ref=by[s]['derpp']; dfc=by[s]['dfc_sign_derpp']
              keys=('protocol','model','resolved_hub_revision','external_bytes','batch_size','steps_per_task','tasks','updates','processed_prompt_slots','seq_len','trainable_parameters','train_last_layers','lr','weight_decay','record_bytes','replay_ce_weight','distill_weight')
              for k in keys: assert ref[k]==dfc[k], (s,k,ref[k],dfc[k])
              assert ref['external_bytes']==512 and dfc['external_bytes']==512
              assert ref['sign_fiber_bytes']==0
              assert dfc['sign_fiber_bytes']==dfc['trainable_parameters']//8
              assert ref['record_capacity']==(512-32)//ref['record_bytes']
              assert dfc['record_capacity']==(512+dfc['sign_fiber_bytes']-32)//dfc['record_bytes']
          def paired(key): return [float(by[s]['dfc_sign_derpp'][key]-by[s]['derpp'][key]) for s in seeds]
          final_diff=paired('final_average_accuracy')
          forget_diff=paired('average_forgetting')
          current_diff=paired('current_task_accuracy')
          mean=lambda xs: float(statistics.mean(xs))
          summary={
            'schema_version':2,
            'protocol':'qwen-causal-partial-v1',
            'source_run_id':31315481945,
            'source_commit':'08962f67fe8e2d78ccfce2f2383024d933f02d8f',
            'seeds':seeds,
            'n_seeds':len(seeds),
            'predeclared_gate':{'final_gain_min':0.10,'forgetting_diff_max':-0.05,'current_diff_min':-0.05},
            'paired_dfc_minus_derpp':{'final':final_diff,'forgetting':forget_diff,'current':current_diff,'final_mean':mean(final_diff),'forgetting_mean':mean(forget_diff),'current_mean':mean(current_diff)},
            'derpp':{k:mean([float(by[s]['derpp'][k]) for s in seeds]) for k in ('final_average_accuracy','average_forgetting','current_task_accuracy','record_capacity','wall_seconds')},
            'dfc_sign_derpp':{k:mean([float(by[s]['dfc_sign_derpp'][k]) for s in seeds]) for k in ('final_average_accuracy','average_forgetting','current_task_accuracy','record_capacity','wall_seconds')},
            'model':by[seeds[0]]['derpp']['model'],
            'model_revision':by[seeds[0]]['derpp']['resolved_hub_revision'],
            'trainable_parameters':by[seeds[0]]['derpp']['trainable_parameters'],
            'train_last_layers':by[seeds[0]]['derpp']['train_last_layers'],
            'external_bytes':512,
            'record_bytes':by[seeds[0]]['derpp']['record_bytes'],
            'dfc_sign_fiber_bytes':by[seeds[0]]['dfc_sign_derpp']['sign_fiber_bytes'],
          }
          passed=(summary['paired_dfc_minus_derpp']['final_mean']>=0.10 and summary['paired_dfc_minus_derpp']['forgetting_mean']<=-0.05 and summary['paired_dfc_minus_derpp']['current_mean']>=-0.05)
          summary['status']='PASS' if passed else 'FAIL'
          raw=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['result_sha256']=hashlib.sha256(raw).hexdigest()
          open('qwen_partial_final_summary.json','w').write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          if not passed: raise SystemExit('predeclared Qwen partial gate failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-partial-final-summary-recovered
          path: qwen_partial_final_summary.json
          if-no-files-found: error
          retention-days: 30
