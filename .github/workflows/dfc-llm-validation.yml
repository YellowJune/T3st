name: DFC Qwen continual validation

on:
  push:
    branches: [dfc-v2.1-validation]
    paths:
      - 'remote/llm_continual_qwen.py'
      - 'remote/torch_fiber.py'
      - '.github/workflows/dfc-llm-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-pilot:
    name: qwen-${{ matrix.method }}-seed${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        method: [naive, derpp, dfc_sign_derpp]
        seed: [701]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dfc-v2.1-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU framework and LLM dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.15,<1' 'accelerate>=1.4,<2' 'huggingface_hub>=0.30,<1' sentencepiece
      - name: Run resource-matched Qwen pilot
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        working-directory: remote
        run: |
          python llm_continual_qwen.py \
            --method '${{ matrix.method }}' \
            --seed '${{ matrix.seed }}' \
            --model 'Qwen/Qwen2.5-0.5B' \
            --steps-per-task 8 \
            --external-bytes 512 \
            --lora-rank 4 \
            --lora-last-layers 4 \
            --lr 0.003 \
            --output '../results/validation_v21/qwen_${{ matrix.method }}_seed${{ matrix.seed }}.json'
      - name: Show result
        run: cat results/validation_v21/qwen_${{ matrix.method }}_seed${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-${{ matrix.method }}-seed${{ matrix.seed }}
          path: results/validation_v21/qwen_${{ matrix.method }}_seed${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 30
