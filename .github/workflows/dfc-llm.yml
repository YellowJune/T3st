name: DFC Qwen classification acquisition pilot

on:
  push:
    paths:
      - "remote/RUN_PROTOCOL_LLM_GPU.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  exactness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Full-FP32 optimizer, arbitrary payload, and checkpoint gate
        working-directory: remote
        run: python -m unittest -v test_torch_fiber.py

  model-manifest:
    needs: exactness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface-hub==0.33.4
      - name: Resolve immutable Qwen revision
        run: |
          python - <<'PY' > model_revision.txt
          from huggingface_hub import model_info
          print(model_info("Qwen/Qwen2.5-0.5B").sha)
          PY
          test "$(wc -c < model_revision.txt)" -gt 20
          cat model_revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-model-revision
          path: model_revision.txt
          if-no-files-found: error
      - name: Persist run identifier before learning
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p remote/run_manifests
          cp model_revision.txt "remote/run_manifests/qwen_cls_${GITHUB_RUN_ID}.txt"
          git checkout -b "result-${GITHUB_RUN_ID}-qwen-cls-manifest"
          git add -f remote/run_manifests/
          git commit -m "Qwen classification run manifest ${GITHUB_RUN_ID}"
          git push origin HEAD

  qwen-acquisition-pilot:
    needs: [exactness, model-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: qwen-model-revision
          path: remote/model_manifest
      - name: Install CPU PyTorch and pinned LLM stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r remote/requirements_llm.txt
      - name: Execute untouched sequence-classification acquisition pilot
        working-directory: remote
        shell: bash
        run: |
          revision="$(tr -d '\r\n' < model_manifest/model_revision.txt)"
          mkdir -p llm_results
          python llm_continual_benchmark.py \
            --method sequential \
            --seed 1087 \
            --revision "$revision" \
            --partial-layers 2 \
            --keys-per-task 4 \
            --num-labels 4 \
            --head-width 256 \
            --updates-per-task 512 \
            --batch-size 2 \
            --external-bytes 2048 \
            --learning-rate 0.00002 \
            --classifier-learning-rate 0.0005 \
            --distill-weight 0.1 \
            --max-grad-norm 1.0 \
            --threads 4 \
            --output llm_results/qwen_sequential_seed1087.json
          sha256sum llm_results/*.json > llm_results/SHA256SUMS.txt
          python -m pip freeze > llm_results/environment_seed1087.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-stable-partial-acquisition-pilot-1087
          path: remote/llm_results/
          if-no-files-found: error
      - name: Persist immutable acquisition evidence
        working-directory: remote
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "result-${GITHUB_RUN_ID}-qwen-stable-partial-pilot-1087"
          git add -f llm_results/
          git commit -m "Qwen stable partial-finetuning pilot 1087"
          git push origin HEAD
      - name: Enforce acquisition gate after evidence persistence
        working-directory: remote
        run: |
          python - <<'PY'
          import json
          row = json.load(open("llm_results/qwen_sequential_seed1087.json"))
          diagonal = [row["accuracy_matrix"][i][i] for i in range(4)]
          assert row["adaptation_head"] == "masked_mean_mlp_sequence_classification"
          assert row["adaptation"]["mode"] == "partial_last_transformer_blocks"
          assert min(diagonal) >= 0.75, diagonal
          assert sum(diagonal) / len(diagonal) >= 0.90, diagonal
          print("acquisition gate passed", diagonal)
          PY
