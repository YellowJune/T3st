name: DFC Qwen-Instruct verbalizer final 3x3 matrix

on:
  push:
    paths:
      - "remote/RUN_PROTOCOL_LLM_GPU.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  exactness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Full-FP32 optimizer, arbitrary payload, and checkpoint gate
        working-directory: remote
        run: python -m unittest -v test_torch_fiber.py

  model-and-dataset-manifest:
    needs: exactness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned manifest stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface-hub==0.33.4 datasets==4.0.0 pyarrow==20.0.0
      - name: Resolve immutable model/data revisions and load every split
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datasets import load_dataset
          from huggingface_hub import HfApi, model_info

          model_repo = "Qwen/Qwen2.5-0.5B-Instruct"
          specs = {
              "ag_news": {
                  "repo": "fancyzhx/ag_news", "source_ref": "main",
                  "config": None, "splits": ["train", "test"],
                  "columns": ["text", "label"],
              },
              "emotion": {
                  "repo": "dair-ai/emotion", "source_ref": "main",
                  "config": "split", "splits": ["train", "test"],
                  "columns": ["text", "label"],
              },
              "banking77": {
                  "repo": "mteb/banking77", "source_ref": "main",
                  "config": None, "splits": ["train", "test"],
                  "columns": ["text", "label"],
              },
              "trec": {
                  "repo": "CogComp/trec", "source_ref": "refs/convert/parquet",
                  "config": None, "splits": ["train", "test"],
                  "columns": ["text", "coarse_label"],
              },
          }
          api = HfApi()
          manifest = {
              "schema": "dfc-qwen-verbalizer-manifest-v1",
              "model": {"repo": model_repo, "revision": model_info(model_repo).sha},
              "datasets": {},
          }
          for name, spec in specs.items():
              revision = api.dataset_info(
                  repo_id=spec["repo"], revision=spec["source_ref"]
              ).sha
              kwargs = {"revision": revision}
              if spec["config"] is None:
                  dataset = load_dataset(spec["repo"], **kwargs)
              else:
                  dataset = load_dataset(spec["repo"], spec["config"], **kwargs)
              assert set(spec["splits"]).issubset(dataset), (name, dataset)
              for split in spec["splits"]:
                  assert set(spec["columns"]).issubset(dataset[split].column_names)
                  assert len(dataset[split]) > 100
              manifest["datasets"][name] = {
                  "repo": spec["repo"], "source_ref": spec["source_ref"],
                  "revision": revision, "config": spec["config"],
                  "split_rows": {split: len(dataset[split]) for split in spec["splits"]},
                  "columns": {split: dataset[split].column_names for split in spec["splits"]},
              }
          canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()
          manifest["manifest_sha256"] = hashlib.sha256(canonical).hexdigest()
          with open("qwen_verbalizer_manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-verbalizer-manifest
          path: qwen_verbalizer_manifest.json
          if-no-files-found: error
      - name: Persist immutable model and dataset manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p remote/run_manifests
          cp qwen_verbalizer_manifest.json "remote/run_manifests/qwen_verbalizer_${GITHUB_RUN_ID}.json"
          git checkout -b "result-${GITHUB_RUN_ID}-qwen-verbalizer-manifest"
          git add -f remote/run_manifests/
          git commit -m "Qwen verbalizer run manifest ${GITHUB_RUN_ID}"
          git push origin HEAD

  qwen-matrix:
    needs: [exactness, model-and-dataset-manifest]
    name: qwen-${{ matrix.method }}-${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        method: [sequential, external_derpp, dfc_sign_derpp]
        seed: [1213, 1223, 1231]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: qwen-verbalizer-manifest
          path: remote/model_manifest
      - name: Install CPU PyTorch and pinned LLM stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r remote/requirements_llm.txt
      - name: Execute sealed cell
        working-directory: remote
        shell: bash
        env:
          CELL_METHOD: ${{ matrix.method }}
          CELL_SEED: ${{ matrix.seed }}
        run: |
          revision="$(python -c 'import json; print(json.load(open("model_manifest/qwen_verbalizer_manifest.json"))["model"]["revision"])')"
          mkdir -p llm_results
          python llm_verbalizer_continual.py \
            --method "$CELL_METHOD" \
            --seed "$CELL_SEED" \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --revision "$revision" \
            --dataset-manifest model_manifest/qwen_verbalizer_manifest.json \
            --rank 8 \
            --alpha 16 \
            --keys-per-task 4 \
            --updates-per-task 512 \
            --batch-size 2 \
            --external-bytes 2048 \
            --learning-rate 0.0005 \
            --distill-weight 0.1 \
            --max-grad-norm 1.0 \
            --threads 4 \
            --output "llm_results/qwen_${CELL_METHOD}_seed${CELL_SEED}.json"
          sha256sum llm_results/*.json > "llm_results/SHA256_${CELL_METHOD}_${CELL_SEED}.txt"
          python -m pip freeze > "llm_results/environment_${CELL_METHOD}_${CELL_SEED}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-cell-${{ matrix.method }}-${{ matrix.seed }}
          path: remote/llm_results/
          if-no-files-found: error
      - name: Persist immutable raw cell
        working-directory: remote
        env:
          CELL_METHOD: ${{ matrix.method }}
          CELL_SEED: ${{ matrix.seed }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "result-${GITHUB_RUN_ID}-qwen-${CELL_METHOD}-${CELL_SEED}"
          git add -f llm_results/
          git commit -m "Qwen verbalizer ${CELL_METHOD} seed ${CELL_SEED}"
          git push origin HEAD

  aggregate:
    needs: qwen-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: qwen-cell-*
          merge-multiple: true
          path: remote/llm_matrix
      - name: Install aggregate dependency
        run: python -m pip install numpy==2.2.6
      - name: Recompute metrics and dominance gate
        working-directory: remote
        shell: bash
        run: |
          test "$(find llm_matrix -maxdepth 1 -name 'qwen_*.json' | wc -l)" -eq 9
          mkdir -p llm_aggregate
          set +e
          python analyze_llm_continual.py \
            --input llm_matrix \
            --run-id "$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --seeds 1213,1223,1231 \
            --minimum-learning-accuracy 0.90 \
            --minimum-accuracy-gain-pp 10.0 \
            --minimum-forgetting-reduction-pp 10.0 \
            --output llm_aggregate/qwen_aggregate.json
          status=$?
          set -e
          printf '%s\n' "$status" > llm_aggregate/analyzer_exit_code.txt
          test -s llm_aggregate/qwen_aggregate.json
          sha256sum llm_matrix/qwen_*.json llm_aggregate/qwen_aggregate.json > llm_aggregate/SHA256SUMS.txt
          python -m pip freeze > llm_aggregate/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-verbalizer-aggregate-${{ github.run_id }}
          path: |
            remote/llm_aggregate/
            remote/llm_matrix/qwen_*.json
          if-no-files-found: error
      - name: Persist immutable aggregate before acceptance
        working-directory: remote
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "result-${GITHUB_RUN_ID}-qwen-verbalizer-aggregate"
          git add -f llm_aggregate/ llm_matrix/qwen_*.json
          git commit -m "Qwen verbalizer aggregate ${GITHUB_RUN_ID}"
          git push origin HEAD
      - name: Enforce predeclared dominance gate
        working-directory: remote
        run: |
          python - <<'PY'
          import json
          row = json.load(open("llm_aggregate/qwen_aggregate.json"))
          assert row["schema"] == "dfc-qwen-verbalizer-aggregate-v1"
          assert row["dominance_gate"]["passed"], row["dominance_gate"]
          print("Qwen verbalizer dominance gate passed", row["dominance_gate"])
          PY
