name: DFC mixed-dtype physical checkpoint gate

on:
  push:
    branches:
      - dfc-v3.2-github-cpu-frontier
    paths:
      - "remote/torch_fiber.py"
      - "cpu_frontier/mixed_dtype_checkpoint.py"
      - ".github/workflows/dfc-mixed-dtype-checkpoint.yml"
  pull_request:
    branches:
      - dfc-v2.1-validation
    paths:
      - "remote/torch_fiber.py"
      - "cpu_frontier/mixed_dtype_checkpoint.py"
      - ".github/workflows/dfc-mixed-dtype-checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    name: torch-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: paper-era-2.7.1
            torch_requirement: torch==2.7.1
          - id: current
            torch_requirement: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "${{ matrix.torch_requirement }}" --index-url https://download.pytorch.org/whl/cpu
      - name: Enforce CPU-only execution
        run: python -c "import torch; print(torch.__version__); assert not torch.cuda.is_available()"
      - name: Run physical checkpoint continuation gate
        run: python cpu_frontier/mixed_dtype_checkpoint.py --output results/mixed_checkpoint/${{ matrix.id }}.json
      - name: Hash evidence
        run: sha256sum results/mixed_checkpoint/${{ matrix.id }}.json > results/mixed_checkpoint/${{ matrix.id }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-mixed-checkpoint-${{ matrix.id }}
          path: results/mixed_checkpoint/
          if-no-files-found: error

  aggregate:
    name: seal-mixed-checkpoint
    needs: checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dfc-mixed-checkpoint-*
          path: results/mixed_checkpoint
          merge-multiple: true
      - name: Verify both PyTorch generations
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('results/mixed_checkpoint')
          files=sorted(root.glob('*.json'))
          if len(files)!=2:
              raise SystemExit(f'expected two evidence files, got {files}')
          rows=[]
          for path in files:
              obj=json.loads(path.read_text())
              assert obj['status']=='PASS'
              assert obj['environment']['cuda_available'] is False
              assert len(obj['cases'])==4
              assert all(c['status']=='PASS' and c['physical_state_dtype']=='float32' for c in obj['cases'])
              rows.append({'file':path.name,'torch':obj['environment']['torch'],'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          report={
              'schema':'dfc-mixed-dtype-physical-checkpoint-aggregate-v1',
              'status':'PASS',
              'github_run_id':os.environ['GITHUB_RUN_ID'],
              'source_sha':os.environ['GITHUB_SHA'],
              'runs':rows,
              'cases':8,
              'claim':'Physical FP32 decoder-fiber optimizer state survives FP16/BF16 checkpoint restore and continued training on paper-era PyTorch 2.7.1 and the current CPU release.',
              'excluded':['GPU performance','H100-class behavior'],
          }
          out=root/'aggregate_mixed_checkpoint.json'
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(out.read_text())
          PY
      - name: Freeze manifest
        run: |
          cd results/mixed_checkpoint
          sha256sum *.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dfc-mixed-checkpoint-complete
          path: results/mixed_checkpoint/
          if-no-files-found: error
      - name: Persist immutable checkpoint evidence
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="result-${GITHUB_RUN_ID}-mixed-checkpoint"
          git checkout -b "$branch"
          git add -f results/mixed_checkpoint/
          git commit -m "Record mixed-dtype DFC checkpoint evidence ${GITHUB_RUN_ID}"
          git push origin HEAD
