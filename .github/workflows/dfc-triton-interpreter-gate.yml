name: DFC Triton fused-kernel interpreter gate

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - '.github/workflows/dfc-triton-interpreter-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triton-interpreter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRITON_INTERPRET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU torch and Triton
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install triton numpy
      - name: Directly execute fused kernels through Triton interpreter
        working-directory: remote
        run: |
          mkdir -p ../results/triton_interpreter
          python - <<'PY'
          import hashlib,json,math,torch
          import triton
          from triton_dfc_adamw import _reference_adamw_kernel,_dfc_adamw_kernel
          torch.manual_seed(71); N=4097; block=256; grid=(triton.cdiv(N,block),)
          p0=torch.randn(N,dtype=torch.float32); g=torch.randn(N,dtype=torch.float32); m0=torch.randn(N,dtype=torch.float32); mag=torch.rand(N,dtype=torch.float32)
          payload=(torch.randint(0,2,(N,),dtype=torch.int32)<<31)
          vbits=mag.view(torch.int32)&0x7fffffff
          pref=p0.clone(); pdfc=p0.clone(); mref=m0.clone(); mdfc=m0.clone(); vref=mag.clone(); vdfc=(vbits|payload).view(torch.float32).clone()
          step=17; lr=4e-4; b1=.9; b2=.999; eps=1e-8; wd=.01
          kw=dict(n_elements=N,lr=lr,beta1=b1,beta2=b2,eps=eps,weight_decay=wd,bias_correction1=1-b1**step,bias_correction2=1-b2**step,block_size=block)
          _reference_adamw_kernel[grid](pref,g,mref,vref,**kw)
          _dfc_adamw_kernel[grid](pdfc,g,mdfc,vdfc,**kw)
          vb=vdfc.view(torch.int32)
          checks={
            'parameter_equal':torch.equal(pref,pdfc),
            'first_moment_equal':torch.equal(mref,mdfc),
            'decoded_second_equal':torch.equal(vref.view(torch.int32),vb&0x7fffffff),
            'payload_preserved':torch.equal(vb&-2147483648,payload),
          }
          # independent payload noninterference
          pa=p0.clone(); pb=p0.clone(); ma=m0.clone(); mb=m0.clone(); paya=(torch.randint(0,2,(N,),dtype=torch.int32)<<31); payb=(torch.randint(0,2,(N,),dtype=torch.int32)<<31); va=(vbits|paya).view(torch.float32).clone(); vb2=(vbits|payb).view(torch.float32).clone()
          _dfc_adamw_kernel[grid](pa,g,ma,va,**kw); _dfc_adamw_kernel[grid](pb,g,mb,vb2,**kw)
          checks.update({'payload_choice_parameter_invariant':torch.equal(pa,pb),'payload_choice_first_invariant':torch.equal(ma,mb),'payload_choice_decoded_second_invariant':torch.equal(va.view(torch.int32)&0x7fffffff,vb2.view(torch.int32)&0x7fffffff),'payload_a_preserved':torch.equal(va.view(torch.int32)&-2147483648,paya),'payload_b_preserved':torch.equal(vb2.view(torch.int32)&-2147483648,payb)})
          out={'schema_version':1,'protocol':'dfc-sign-triton-interpreter-v1','triton_version':triton.__version__,'coordinates':N,'status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'claim_boundary':'Triton interpreter execution of the fused kernels; not actual GPU hardware timing or codegen evidence.'}
          raw=json.dumps(out,sort_keys=True,separators=(',',':')).encode(); out['result_sha256']=hashlib.sha256(raw).hexdigest()
          open('../results/triton_interpreter/summary.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          if out['status']!='PASS': raise SystemExit('interpreter semantic gate failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfc-triton-interpreter
          path: results/triton_interpreter/summary.json
          if-no-files-found: warn
          retention-days: 30
