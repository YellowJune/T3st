name: DFC v3.2 Qwen task-permutation CPU pilot

on:
  push:
    branches: [dfc-v3.2-github-cpu-frontier]
    paths: ['.github/workflows/dfc-v32-taskperm-pilot.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    name: taskperm-${{ matrix.method }}-seed1501
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        method: [derpp, dfc_sign_derpp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU execution stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install 'transformers>=4.51,<5' 'peft>=0.15,<1' 'accelerate>=1.4,<2' 'huggingface_hub>=0.30,<1' 'datasets>=3,<5' sentencepiece
      - name: Enforce CPU-only boundary
        run: python -c "import torch; assert not torch.cuda.is_available()"
      - name: Run balanced real-text continual task-adaptation pilot
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        working-directory: remote
        run: |
          python llm_continual_qwen_agnews_taskperm.py \
            --method '${{ matrix.method }}' \
            --seed 1501 \
            --steps-per-task 96 \
            --external-bytes 512 \
            --train-per-class 8 \
            --eval-per-class 16 \
            --lora-rank 4 \
            --lora-last-layers 4 \
            --lr 0.01 \
            --distill-weight 0.025 \
            --output '../results/taskperm_pilot/${{ matrix.method }}_seed1501.json'
      - uses: actions/upload-artifact@v4
        with:
          name: taskperm-${{ matrix.method }}-seed1501
          path: results/taskperm_pilot/*.json
          if-no-files-found: error
          retention-days: 90

  analyze:
    name: analyze-development-pilot
    needs: pilot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: taskperm-*-seed1501
          path: results/taskperm_pilot
          merge-multiple: true
      - name: Audit resource identity and compute paired delta
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('results/taskperm_pilot')
          der=json.loads((root/'derpp_seed1501.json').read_text())
          dfc=json.loads((root/'dfc_sign_derpp_seed1501.json').read_text())
          keys=(
            'model','resolved_model_revision','dataset','resolved_dataset_revision',
            'dataset_subset_sha256','external_bytes','batch_size','steps_per_task',
            'tasks','updates','processed_text_slots','seq_len','trainable_parameters',
            'lora_rank','lora_last_layers','lr','weight_decay','record_bytes',
            'distill_weight','train_per_class','eval_per_class','replay_fraction',
          )
          drift={k:[der.get(k),dfc.get(k)] for k in keys if der.get(k)!=dfc.get(k)}
          if drift:
              raise SystemExit(f'resource/protocol drift: {drift}')
          if dfc['sign_fiber_bytes'] != dfc['trainable_parameters']//8:
              raise SystemExit('sign-fiber capacity identity failed')
          delta={
            'final_accuracy_pp':100*(dfc['final_average_accuracy']-der['final_average_accuracy']),
            'forgetting_pp':100*(dfc['average_forgetting']-der['average_forgetting']),
            'current_task_pp':100*(dfc['current_task_accuracy']-der['current_task_accuracy']),
          }
          # Development-only screen.  This is NOT a confirmatory publication gate;
          # it only decides whether a separately frozen multi-seed protocol is worth running.
          promising=(delta['final_accuracy_pp']>0 and delta['forgetting_pp']<=0 and delta['current_task_pp']>=-5)
          report={
            'schema':'dfc-qwen-taskperm-development-pilot-v1',
            'status':'COMPLETE',
            'confirmatory':False,
            'seed':1501,
            'source_sha':os.environ['GITHUB_SHA'],
            'hardware_scope':'GitHub-hosted CPU only',
            'resource_identity':'PASS',
            'derpp':{k:der[k] for k in ('final_average_accuracy','average_forgetting','current_task_accuracy','record_capacity','wall_seconds')},
            'dfc_sign_derpp':{k:dfc[k] for k in ('final_average_accuracy','average_forgetting','current_task_accuracy','record_capacity','wall_seconds','sign_fiber_bytes')},
            'paired_delta':delta,
            'development_screen_promising':promising,
            'raw_sha256':{
              'derpp':hashlib.sha256((root/'derpp_seed1501.json').read_bytes()).hexdigest(),
              'dfc_sign_derpp':hashlib.sha256((root/'dfc_sign_derpp_seed1501.json').read_bytes()).hexdigest(),
            },
            'note':'Pilot result is development evidence only. Any confirmatory multi-seed gate must be frozen in a later source commit before its evaluation seeds are executed.'
          }
          out=root/'pilot_summary.json'
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(out.read_text())
          PY
      - name: Freeze pilot hashes
        run: |
          cd results/taskperm_pilot
          sha256sum *.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taskperm-pilot-complete-${{ github.run_id }}
          path: results/taskperm_pilot/
          if-no-files-found: error
          retention-days: 90
      - name: Persist development evidence on isolated result branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="result-${GITHUB_RUN_ID}-taskperm-pilot"
          git checkout -b "$branch"
          git add -f results/taskperm_pilot/
          git commit -m "Record Qwen task-permutation development pilot ${GITHUB_RUN_ID}"
          git push origin HEAD
