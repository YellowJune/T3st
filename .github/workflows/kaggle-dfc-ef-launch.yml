name: Launch DFC-EF Kaggle validation

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'kaggle/launch/gpu_gate'
      - 'kaggle/launch/qwen_campaign'
      - 'kaggle/launch/tpu_gate'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KAGGLE_CONFIG_DIR: /tmp/kaggle-auth
      KAGGLE_CONFIG_B64: eyJ1c2VybmFtZSI6InllbGx3b2p1bmUwODMiLCJrZXkiOiJiODQwNWMyYTlmY2ZkOWVlMmJhMDk2NjdmM2I5ZDljZiJ9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install temporary legacy Kaggle credential
        shell: bash
        run: |
          umask 077
          mkdir -p "$KAGGLE_CONFIG_DIR"
          printf '%s' "$KAGGLE_CONFIG_B64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['KAGGLE_CONFIG_DIR'],'kaggle.json')
          d=json.load(open(p))
          assert d.get('username') and len(d.get('key','')) >= 20
          print('legacy credential file validated for', d['username'])
          PY
      - name: Install official Kaggle CLI
        run: |
          python -m pip install --quiet 'kaggle>=2,<3'
          kaggle --version
          kaggle kernels list --mine --page-size 1 >/dev/null
      - name: Launch GPU systems gate
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/dfc_ef_gpu_gate --accelerator NvidiaTeslaT4Highmem --timeout 7200 \
            || kaggle kernels push -p kaggle/dfc_ef_gpu_gate --accelerator NvidiaTeslaT4 --timeout 7200
          mkdir -p kaggle_status kaggle_gpu_output
          for i in $(seq 1 180); do
            kaggle kernels status yellwojune083/dfc-ef-gpu-systems-gate | tee kaggle_status/status.txt || true
            if grep -qiE 'complete' kaggle_status/status.txt; then break; fi
            if grep -qiE 'error|failed|cancel' kaggle_status/status.txt; then exit 31; fi
            sleep 20
          done
          grep -qiE 'complete' kaggle_status/status.txt
          kaggle kernels output yellwojune083/dfc-ef-gpu-systems-gate -p kaggle_gpu_output -o
          find kaggle_gpu_output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Upload downloaded GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfc-ef-kaggle-gpu-evidence-${{ github.sha }}
          path: |
            kaggle_status/
            kaggle_gpu_output/
          if-no-files-found: warn
          retention-days: 30
