name: Launch DFC-EF Kaggle validation

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'kaggle/launch/gpu_gate'
      - 'kaggle/launch/qwen_campaign'
      - 'kaggle/launch/tpu_gate'
  workflow_dispatch:
    inputs:
      target:
        description: 'gpu_gate | qwen_campaign | tpu_gate'
        required: true
        default: gpu_gate

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KAGGLE_CONFIG_DIR: ${{ runner.temp }}/kaggle-auth
      KAGGLE_CONFIG_B64: eyJ1c2VybmFtZSI6InllbGx3b2p1bmUwODMiLCJrZXkiOiJiODQwNWMyYTlmY2ZkOWVlMmJhMDk2NjdmM2I5ZDljZiJ9
      MODIFIED_JSON: ${{ toJson(github.event.head_commit.modified) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install temporary legacy Kaggle credential
        shell: bash
        run: |
          umask 077
          mkdir -p "$KAGGLE_CONFIG_DIR"
          printf '%s' "$KAGGLE_CONFIG_B64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['KAGGLE_CONFIG_DIR'],'kaggle.json')
          d=json.load(open(p))
          assert d.get('username') and len(d.get('key','')) >= 20
          print('legacy credential file validated for', d['username'])
          PY
      - name: Install official Kaggle CLI
        run: |
          python -m pip install --quiet 'kaggle>=2,<3'
          kaggle --version
          kaggle kernels list --mine --page-size 1 >/dev/null
      - name: Resolve launch target
        id: target
        shell: bash
        run: |
          TARGET='${{ github.event.inputs.target }}'
          if [ -z "$TARGET" ]; then
            if echo "$MODIFIED_JSON" | grep -q 'kaggle/launch/gpu_gate'; then TARGET='gpu_gate'; fi
            if echo "$MODIFIED_JSON" | grep -q 'kaggle/launch/qwen_campaign'; then TARGET='qwen_campaign'; fi
            if echo "$MODIFIED_JSON" | grep -q 'kaggle/launch/tpu_gate'; then TARGET='tpu_gate'; fi
          fi
          case "$TARGET" in gpu_gate|qwen_campaign|tpu_gate) ;; *) echo "bad target: $TARGET" >&2; exit 21;; esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Launching $TARGET"
      - name: Launch GPU systems gate
        if: steps.target.outputs.target == 'gpu_gate'
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/dfc_ef_gpu_gate --accelerator NvidiaTeslaT4Highmem --timeout 7200 \
            || kaggle kernels push -p kaggle/dfc_ef_gpu_gate --accelerator NvidiaTeslaT4 --timeout 7200
          mkdir -p kaggle_status kaggle_gpu_output
          for i in $(seq 1 180); do
            kaggle kernels status yellwojune083/dfc-ef-gpu-systems-gate | tee kaggle_status/status.txt || true
            if grep -qiE 'complete' kaggle_status/status.txt; then break; fi
            if grep -qiE 'error|failed|cancel' kaggle_status/status.txt; then exit 31; fi
            sleep 20
          done
          grep -qiE 'complete' kaggle_status/status.txt
          kaggle kernels output yellwojune083/dfc-ef-gpu-systems-gate -p kaggle_gpu_output -o
          find kaggle_gpu_output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Launch Qwen campaign
        if: steps.target.outputs.target == 'qwen_campaign'
        run: |
          kaggle kernels push -p kaggle/dfc_ef_qwen_campaign --accelerator NvidiaTeslaT4Highmem --timeout 39600 \
            || kaggle kernels push -p kaggle/dfc_ef_qwen_campaign --accelerator NvidiaTeslaT4 --timeout 39600
      - name: Launch TPU gate
        if: steps.target.outputs.target == 'tpu_gate'
        run: |
          kaggle kernels push -p kaggle/dfc_ef_tpu_gate --accelerator TpuV38 --timeout 14400 \
            || kaggle kernels push -p kaggle/dfc_ef_tpu_gate --timeout 14400
      - name: Upload downloaded GPU evidence
        if: always() && steps.target.outputs.target == 'gpu_gate'
        uses: actions/upload-artifact@v4
        with:
          name: dfc-ef-kaggle-gpu-evidence-${{ github.sha }}
          path: |
            kaggle_status/
            kaggle_gpu_output/
          if-no-files-found: warn
          retention-days: 30
