name: Launch DFC-EF fused Qwen traffic campaign

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'kaggle/launch/qwen_fused_traffic_campaign'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KAGGLE_CONFIG_DIR: /tmp/kaggle-auth
      KAGGLE_CONFIG_B64: eyJ1c2VybmFtZSI6InllbGx3b2p1bmUwODMiLCJrZXkiOiI4OWNjMGI2ZjFkZGRmY2RmMDY2OWE5ODI5OTE5YjNhMCJ9
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle credential from Actions secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "Using KAGGLE_API_TOKEN secret"
          elif [ -n "$KAGGLE_CONFIG_B64" ]; then
            umask 077
            mkdir -p "$KAGGLE_CONFIG_DIR"
            printf '%s' "$KAGGLE_CONFIG_B64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
            python - <<'PY'
          import json, os
          p=os.path.join(os.environ['KAGGLE_CONFIG_DIR'],'kaggle.json')
          d=json.load(open(p))
          assert d.get('username') and len(d.get('key','')) >= 20
          print('Legacy Kaggle credential validated for', d['username'])
          PY
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            echo "Using KAGGLE_USERNAME/KAGGLE_KEY secrets"
          else
            echo "No supported Kaggle Actions secret is configured" >&2
            exit 42
          fi
      - name: Launch fused traffic-elimination campaign
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'kaggle>=2,<3'
          kaggle kernels push -p kaggle/dfc_ef_qwen_fused_campaign --accelerator NvidiaTeslaT4Highmem --timeout 39600 \
            || kaggle kernels push -p kaggle/dfc_ef_qwen_fused_campaign --accelerator NvidiaTeslaT4 --timeout 39600
          sleep 5
          kaggle kernels status yellwojune083/dfc-ef-qwen-fused-traffic-campaign
