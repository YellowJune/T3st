name: Launch DFC-EF fused Qwen traffic campaign

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'kaggle/launch/qwen_fused_traffic_campaign'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KAGGLE_CONFIG_DIR: /tmp/kaggle-auth
      KAGGLE_CONFIG_B64: ${{ secrets.KAGGLE_CONFIG_B64 }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_AUTH_MODE=token" >> "$GITHUB_ENV"
          elif [ -n "$KAGGLE_CONFIG_B64" ]; then
            umask 077
            mkdir -p "$KAGGLE_CONFIG_DIR"
            printf '%s' "$KAGGLE_CONFIG_B64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
            python - <<'PY'
          import json, os
          p=os.path.join(os.environ['KAGGLE_CONFIG_DIR'],'kaggle.json')
          d=json.load(open(p))
          print('::add-mask::'+d['key'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('KAGGLE_USERNAME='+d['username']+'\n')
              f.write('KAGGLE_KEY='+d['key']+'\n')
          print('Credential structure validated for', d['username'])
          PY
            echo "KAGGLE_AUTH_MODE=legacy_env" >> "$GITHUB_ENV"
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            echo "::add-mask::$KAGGLE_KEY"
            echo "KAGGLE_AUTH_MODE=legacy_env" >> "$GITHUB_ENV"
          elif [ -f kaggle/launch/.tmp_kaggle_auth.json ]; then
            python - <<'PY'
          import json, os
          d=json.load(open('kaggle/launch/.tmp_kaggle_auth.json'))
          assert d.get('username') and len(d.get('key','')) >= 20
          print('::add-mask::'+d['key'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('KAGGLE_USERNAME='+d['username']+'\n')
              f.write('KAGGLE_KEY='+d['key']+'\n')
          print('Temporary diagnostic credential loaded for', d['username'])
          PY
            echo "KAGGLE_AUTH_MODE=legacy_env" >> "$GITHUB_ENV"
          else
            echo "No supported Kaggle credential is configured" >&2
            exit 42
          fi
      - name: Authenticate and launch fused traffic-elimination campaign
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'kaggle==2.2.3'
          kaggle --version
          echo 'Running authenticated Kaggle preflight...'
          kaggle kernels list --mine --page-size 1 >/tmp/kaggle-preflight.txt
          echo 'Kaggle API authentication preflight passed.'
          kaggle kernels push -p kaggle/dfc_ef_qwen_fused_campaign --accelerator NvidiaTeslaT4Highmem --timeout 39600 \
            || kaggle kernels push -p kaggle/dfc_ef_qwen_fused_campaign --accelerator NvidiaTeslaT4 --timeout 39600
          sleep 5
          kaggle kernels status yellwojune083/dfc-ef-qwen-fused-traffic-campaign
