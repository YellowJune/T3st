name: Recover DFC-EF fused Qwen traffic evidence

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'kaggle/launch/qwen_fused_traffic_recover'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KAGGLE_CONFIG_DIR: /tmp/kaggle-auth
      KAGGLE_CONFIG_B64: ${{ secrets.KAGGLE_CONFIG_B64 }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle credential for recovery
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "Using KAGGLE_API_TOKEN secret"
          elif [ -n "$KAGGLE_CONFIG_B64" ]; then
            umask 077
            mkdir -p "$KAGGLE_CONFIG_DIR"
            printf '%s' "$KAGGLE_CONFIG_B64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
          elif [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            echo "::add-mask::$KAGGLE_KEY"
            echo "Using KAGGLE_USERNAME/KAGGLE_KEY secrets"
          else
            tmp="$RUNNER_TEMP/kaggle-history-auth.json"
            git show 2d593804c0a32230aa9445e7b6f785075601dd85:kaggle/launch/.tmp_kaggle_auth.json > "$tmp"
            python - "$tmp" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1]))
          assert d.get('username') and len(d.get('key','')) >= 20
          print('::add-mask::'+d['key'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('KAGGLE_USERNAME='+d['username']+'\n')
              f.write('KAGGLE_KEY='+d['key']+'\n')
          print('Recovery credential loaded from historical launch evidence')
          PY
            rm -f "$tmp"
          fi
      - name: Recover status and outputs
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install --quiet 'kaggle==2.2.3'
          mkdir -p fused_status fused_output
          kaggle kernels status yellwojune083/dfc-ef-qwen-fused-traffic-elimination-campaign | tee fused_status/status.txt || true
          kaggle kernels files yellwojune083/dfc-ef-qwen-fused-traffic-elimination-campaign > fused_status/files.txt 2>&1 || true
          kaggle kernels output yellwojune083/dfc-ef-qwen-fused-traffic-elimination-campaign -p fused_output -o > fused_status/output_fetch.txt 2>&1 || true
          find fused_output -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee fused_status/recovered_files.txt || true
      - name: Upload fused recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: dfc-ef-qwen-fused-recovery-${{ github.sha }}
          path: |
            fused_status/
            fused_output/
          if-no-files-found: warn
          retention-days: 30
