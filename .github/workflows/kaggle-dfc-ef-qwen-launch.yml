name: Launch DFC-EF Qwen Kaggle GPU campaign

on:
  push:
    branches: [dfc-h200-final]
    paths:
      - 'kaggle/launch/qwen_gpu_campaign'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse temporary Kaggle credential from sealed launcher
        shell: bash
        run: |
          set -euo pipefail
          export KAGGLE_CONFIG_DIR="$RUNNER_TEMP/kaggle-auth"
          mkdir -p "$KAGGLE_CONFIG_DIR"
          b64=$(python - <<'PY'
          import pathlib, re
          text=pathlib.Path('.github/workflows/kaggle-dfc-ef-launch.yml').read_text()
          m=re.search(r'^\s*KAGGLE_CONFIG_B64:\s*(\S+)\s*$', text, re.M)
          if not m: raise SystemExit('credential marker not found')
          print(m.group(1))
          PY
          )
          printf '%s' "$b64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
          chmod 600 "$KAGGLE_CONFIG_DIR/kaggle.json"
          echo "KAGGLE_CONFIG_DIR=$KAGGLE_CONFIG_DIR" >> "$GITHUB_ENV"
      - name: Launch long Qwen campaign
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'kaggle>=2,<3'
          kaggle kernels push -p kaggle/dfc_ef_qwen_campaign --accelerator NvidiaTeslaT4Highmem --timeout 39600 \
            || kaggle kernels push -p kaggle/dfc_ef_qwen_campaign --accelerator NvidiaTeslaT4 --timeout 39600
          sleep 5
          kaggle kernels status yellwojune083/dfc-ef-qwen-free-gpu-campaign
