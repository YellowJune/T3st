name: DFC SIGN NMI general Kaggle T4 gate

on:
  workflow_dispatch:
  push:
    branches: [dfc-nmi-sign-gpu-20260909]
    paths:
      - 'kaggle/launch/general_t4_dfc_sign'

permissions:
  contents: read

jobs:
  kaggle-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KAGGLE_CONFIG_DIR: /tmp/kaggle-auth
      KAGGLE_CONFIG_B64: ${{ secrets.KAGGLE_CONFIG_B64 }}
      KERNEL_ID: yellwojune083/dfc-sign-triton-nmi-general-t4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_CONFIG_B64" || { echo 'KAGGLE_CONFIG_B64 is not configured' >&2; exit 42; }
          umask 077
          mkdir -p "$KAGGLE_CONFIG_DIR"
          printf '%s' "$KAGGLE_CONFIG_B64" | base64 --decode > "$KAGGLE_CONFIG_DIR/kaggle.json"
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['KAGGLE_CONFIG_DIR'],'kaggle.json')
          d=json.load(open(p))
          assert d.get('username') and len(d.get('key','')) >= 20
          PY
      - name: Push private standard-T4 kernel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'kaggle>=2,<3'
          kaggle kernels list --mine --page-size 1 >/dev/null
          kaggle kernels push -p kaggle/dfc_sign_triton_nmi_general_t4 --accelerator NvidiaTeslaT4 --timeout 3600
      - name: Poll to completion
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/kaggle-status.txt
          terminal=0
          for i in $(seq 1 240); do
            out="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            printf '%s\n' "$out" | tee /tmp/kaggle-status.txt
            low="$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$low" | grep -Eq 'complete|completed'; then terminal=1; break; fi
            if printf '%s' "$low" | grep -Eq 'error|failed|cancel'; then terminal=2; break; fi
            sleep 15
          done
          test "$terminal" -eq 1
      - name: Download and validate output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kaggle_out
          kaggle kernels output "$KERNEL_ID" -p kaggle_out -q
          test -f kaggle_out/dfc_sign_triton_gpu.json
          python - <<'PY'
          import json
          d=json.load(open('kaggle_out/dfc_sign_triton_gpu.json'))
          assert all(r['bitwise_exact'] for r in d['rows'])
          print(json.dumps({
            'gpu_name':d['gpu_name'],
            'median_overhead_percent':d['median_overhead_percent'],
            'overhead_gate_passed':d['overhead_gate_passed'],
            'result_sha256':d['result_sha256']}, indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfc-sign-general-t4-nmi-gpu
          path: |
            kaggle_out/**
            /tmp/kaggle-status.txt
          if-no-files-found: warn
